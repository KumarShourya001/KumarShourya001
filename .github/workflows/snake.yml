name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23A9662A&color_dots=%23EFEBE5,%23E9D5B8,%23D9B183,%23C08A50,%23A9662A
            dist/github-snake-dark.svg?color_snake=%23D9A05B&color_dots=%23161B22,%233A2E20,%236B4E28,%23A9762F,%23D9A05B

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
